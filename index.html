<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7d8">
<title>One More Door Halves</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#efe7d8;--card:#fbf6ec;--card2:#e9dfcd;--ink:#1f1a14;--muted:#6a5f52;--line:#d6c9b3;--accent:#b4441f;--accent-ink:#fff;--ok:#2f7a4b;--bad:#b3261e;--gold:#94690a;--ember:#c4501a;--atk:#c0442c;--blk:#3f78a8;--skl:#4f8a4f;--shadow:0 6px 24px rgba(40,25,10,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110e0b;--card:#1d1813;--card2:#2a231c;--ink:#efe5d6;--muted:#a59886;--line:#3b3128;--accent:#e2774f;--accent-ink:#1a120c;--ok:#6cc18d;--bad:#f08a80;--gold:#e8bd4e;--ember:#f08a50;--atk:#f0866e;--blk:#7fb3e0;--skl:#8fca8f;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110e0b;--card:#1d1813;--card2:#2a231c;--ink:#efe5d6;--muted:#a59886;--line:#3b3128;--accent:#e2774f;--accent-ink:#1a120c;--ok:#6cc18d;--bad:#f08a80;--gold:#e8bd4e;--ember:#f08a50;--atk:#f0866e;--blk:#7fb3e0;--skl:#8fca8f;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;line-height:1.15;margin:0}
.gold{color:var(--gold)}.ember{color:var(--ember)}.okc{color:var(--ok)}.badc{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:8px 12px;cursor:pointer;min-height:44px;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.safe{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
button.ghost{background:transparent}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
/* top bars */
.bar1{display:flex;align-items:center;gap:8px;flex:none}
.bar1 .where{font:700 15px Georgia,serif;white-space:nowrap}
.bar1 .money{overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{min-height:36px;min-width:40px;padding:4px 8px;font-size:13px;border-radius:9px;position:relative}
.ib .ct{position:absolute;top:-6px;right:-6px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 5px}
.bar2{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;flex:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.gbar{position:relative;height:16px;border-radius:8px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}.gbar i{display:block;height:100%;transition:width .35s}.gbar span{position:absolute;inset:0;font:700 11px/15px system-ui;text-align:center;color:var(--ink)}
.fury{display:flex;gap:3px}.fury i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ember);display:block}.fury i.on{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.st{white-space:nowrap}.st small{font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-right:3px}
.track{display:flex;gap:2px;flex:none}.pip{flex:1;height:6px;border-radius:3px;background:var(--card2)}.pip.done{background:var(--ok)}.pip.now{background:var(--accent)}.pip.boss{background:#8a1c1c66}.pip.boss.done{background:var(--ok)}
/* scene */
.scene{position:relative;flex:1 1 auto;min-height:130px;border-radius:14px;overflow:hidden;background:#15110d;box-shadow:var(--shadow)}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.actors{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6% 3%;pointer-events:none}
.actor{position:relative;height:62%;display:flex;align-items:flex-end}
.actor svg{display:block;height:100%;width:auto;overflow:visible}
.mon{height:66%}
.tag{position:absolute;top:7px;left:8px;font:600 11.5px system-ui;color:#f3e2c4;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px}
.chips{position:absolute;top:30px;left:8px;right:42%;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.5px;font-weight:600;background:rgba(20,10,5,.8);color:#ffd9a8;border:1px solid rgba(255,190,120,.35);border-radius:999px;padding:2px 7px}
.chip.cool{color:#bfe3ff;border-color:rgba(150,200,255,.35)}
.narr{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fbeedb;font-size:12.5px;line-height:1.3}
.narr p{margin:1px 0}
.float{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:700 22px Georgia,serif;color:#ffe08a;text-shadow:0 2px 6px #000;animation:floatUp 1.2s ease-out forwards;white-space:nowrap;pointer-events:none}
.float.bad{color:#ff9a8a}.float.m{left:72%}.float.h{left:24%}.float.good{color:#9be3b3}.float.blk{color:#bfe3ff}
.hpbar{position:absolute;bottom:100%;left:4%;right:4%;height:12px;border-radius:6px;background:#000a;border:1px solid #0008;overflow:hidden;margin-bottom:3px;min-width:70px}.hpbar i{display:block;height:100%;background:#d8443a;transition:width .35s}.hpbar.me i{background:#4fb37a}.hpbar span{position:absolute;inset:0;font:700 9.5px/12px system-ui;color:#fff;text-align:center;text-shadow:0 1px 2px #000}
.shield{position:absolute;bottom:calc(100% + 17px);left:50%;transform:translateX(-50%);background:#1d3550ee;color:#d7ecff;border:2px solid #7fb3e0;border-radius:8px;padding:1px 7px;font:700 12px system-ui;white-space:nowrap}
.intent{position:absolute;bottom:calc(100% + 17px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#1d1813ee;color:#f3e2c4;border:2px solid #6a5a45;border-radius:9px;padding:2px 8px;font:600 12px system-ui,sans-serif;animation:pop .3s}
.intent b{color:#ff9a8a;font-size:14px}.intent.i-heavy{border-color:#d8443a;background:#3a1210ee}.intent.i-guard{border-color:#7fa7c9}.intent.i-hex{border-color:#a77fd0}.intent.i-dazed{opacity:.75}
/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(40%)}100%{transform:translateX(0)}}
@keyframes fall{0%{transform:none;opacity:1}100%{transform:translateY(12%) rotate(14deg) scale(.9);opacity:.35;filter:grayscale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7%)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
@keyframes flee{0%{transform:none;opacity:1}100%{transform:translateX(-70%);opacity:0}}
@keyframes glow{0%{filter:drop-shadow(0 0 0 #ffd76a)}50%{filter:drop-shadow(0 0 12px #ffd76a)}100%{filter:drop-shadow(0 0 0 #ffd76a)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
@keyframes enter{0%{transform:scale(1.2);opacity:.2}100%{transform:none;opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}33%{transform:scale(.9,1.08)}66%{transform:scale(1.06,.94)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes redflash{0%{opacity:.55}100%{opacity:0}}
@keyframes deal{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}
.mon .body{animation:bob 2.6s ease-in-out infinite}.hero .body{animation:bob 3.2s ease-in-out infinite}
.fx-lunge{animation:lunge .45s ease-out}.fx-fall{animation:fall .7s ease-in forwards}.fallen{transform:translateY(12%) rotate(14deg) scale(.9);opacity:.35;filter:grayscale(1)}.gone{opacity:0}
.fx-shake,.fx-hit{animation:shake .4s}.fx-flee{animation:flee .6s ease-in forwards}.fx-glow{animation:glow .9s}.fx-enter{animation:enter .5s ease-out}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s infinite}
.redflash{position:absolute;inset:0;background:#b3261e;animation:redflash .6s forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* bottom panel */
.panel{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.say{font-size:13px;line-height:1.3}
.say b{font-weight:700}
.next{padding:5px 8px;border-radius:8px;background:var(--card2);font-size:12.5px;border-left:4px solid var(--muted);line-height:1.3}.next.i-heavy{border-left-color:var(--bad)}.next.i-strike{border-left-color:var(--accent)}.next.i-hex{border-left-color:#8a5fc0}.next.i-guard{border-left-color:#5f87a9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.two button,.three button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.two small,.three small{font-weight:500;font-size:11.5px;opacity:.92}
/* cards */
.hand{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.hc{position:relative;min-height:96px;padding:16px 4px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;text-align:center;animation:deal .25s ease-out both}
.hc .cost{position:absolute;top:-1px;left:-1px;width:22px;height:22px;border-radius:9px 0 9px 0;background:var(--ember);color:#fff;font:700 13px/22px system-ui}
.hc .ty{position:absolute;top:3px;right:5px;font-size:11px;opacity:.8}
.hc .nm{font:700 12.5px/1.15 Georgia,serif}
.hc .ef{font-size:12px;font-weight:600;line-height:1.2}
.hc .big{font:700 20px/1 Georgia,serif}
.hc.atk{border-color:var(--atk)}.hc.atk .big{color:var(--atk)}.hc.blk{border-color:var(--blk)}.hc.blk .big{color:var(--blk)}.hc.skill{border-color:var(--skl)}.hc.skill .big{color:var(--skl)}
.hc.kill{box-shadow:0 0 0 2px var(--gold) inset,0 0 10px var(--gold)}
.hc:disabled{opacity:.42}
.hc .tg{font-size:10px;color:var(--muted);font-weight:500}
.ctl{display:flex;gap:6px;align-items:center}
.energy{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}.energy i{width:16px;height:16px;border-radius:50%;background:var(--ember);display:block;box-shadow:0 0 6px var(--ember)}.energy i.off{background:var(--card2);box-shadow:none;border:2px solid var(--line)}
.belt{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.bi{min-height:40px;flex:1 1 0;min-width:0;max-width:40px;padding:2px;border-radius:9px}.bi svg{width:100%;height:100%;display:block}
.endt{min-width:84px;flex:none}
/* sheets and modals */
.modal,.sheetbg{position:fixed;inset:0;background:rgba(10,6,3,.62);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.sheetbg{align-items:flex-end;padding:0}
.mcard{width:100%;max-width:420px;max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;animation:pop .2s ease-out}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:12px 16px max(14px,env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mcard .art{display:flex;justify-content:center;margin:2px 0 4px}.mcard .art svg{width:72px;height:72px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;text-align:center}
.mcard h2{text-align:center;font-size:20px;margin-top:2px}
.kind{text-align:center;color:var(--muted);font-size:13px;margin-top:2px}
.flav{text-align:center;font-style:italic;color:var(--muted);font-size:13px;margin:6px 0}
.cmp{background:var(--card2);border-radius:10px;padding:6px 10px;font-size:13px;margin:8px 0}
.acts{display:grid;gap:6px;margin-top:10px}
.acts button{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:44px}
.acts button small{font-weight:500;opacity:.9;font-size:12px}
.favpick{display:grid;gap:6px}
.favc{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:8px 10px;text-align:left}.favc svg{grid-row:span 3}.favc .pn{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.favc .fd{font-size:12px;font-weight:500;opacity:.92}
.favc.p-lamp{border-color:#c98a2a}.favc.p-rat{border-color:#8a7fa0}.favc.p-mason{border-color:#7f8d94}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid.four{grid-template-columns:repeat(4,1fr)}
.tc{position:relative;padding:16px 5px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0;font-weight:600}
.tc .cost{position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-radius:9px 0 9px 0;background:var(--ember);color:#fff;font:700 12px/20px system-ui}
.tc .nm{font:700 12.5px/1.15 Georgia,serif}.tc .d{font-size:11px;font-weight:500;color:var(--muted);line-height:1.25}
.tc.atk{border-color:var(--atk)}.tc.blk{border-color:var(--blk)}.tc.skill{border-color:var(--skl)}
.tc.sm{padding:14px 3px 4px}.tc.sm .nm{font-size:11px}
.doll{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.icard{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:5px 3px;border-radius:10px;border:1px solid var(--line);background:var(--card2);min-height:0;font-weight:600}
.icard svg{width:30px;height:30px}.icard .nm{font-size:10.5px;line-height:1.15}.icard .fx{font-size:10px;font-weight:500;color:var(--muted)}
.icard.empty{border-style:dashed;background:transparent;color:var(--muted);font-weight:500}
.slotlab{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 5px}.sec h3{font-size:14px}
.log p{margin:3px 0;font-size:13px;color:var(--muted)}
.favs{display:flex;flex-wrap:wrap;gap:4px}.fav{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px 1px 2px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
/* town */
.thead{display:flex;align-items:center;gap:10px;flex:none}.thead h1{font-size:19px;flex:1}
.tscene{position:relative;flex:0 0 auto;height:clamp(96px,19dvh,170px);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tscene svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none;background:var(--card2);padding:3px;border-radius:12px}
.tabs button{min-height:36px;padding:4px;font-size:13px;border:none;background:transparent;border-radius:9px}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:3px;vertical-align:middle}
.tbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.call{border:2px solid var(--line);border-radius:10px;padding:6px;min-height:0;background:var(--card);text-align:center;font-size:13px}
.call.sel{border-color:var(--accent);background:var(--card2)}
.call small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.lease{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center;text-align:center}
.lease b{font-family:Georgia,serif;font-size:16px}
.prov{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.prov button{min-height:52px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.2}
.prov button.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.prov small{font-weight:500;font-size:10.5px;color:var(--muted)}.prov small.pe{color:var(--ink);font-size:11px}
.fitem{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}.fitem:first-child{border-top:none}
.fitem .d{font-size:11.5px;color:var(--muted);line-height:1.25}
.fitem button{min-height:38px;min-width:84px;font-size:12.5px;padding:4px 8px}
.pips{letter-spacing:1px;color:var(--accent);font-size:11px}
.go{flex:none;min-height:54px;font-size:17px;width:100%}
.keeper{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fbeedb;font-size:12.5px;line-height:1.3}
@media (max-height:700px){.hc{min-height:84px}.hc .big{font-size:17px}.two button,.three button{min-height:50px}.go{min-height:48px}}
#tip{position:fixed;z-index:50;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:8px 11px;border-radius:10px;box-shadow:var(--shadow);pointer-events:none;animation:pop .15s}
#tip[hidden]{display:none}
button,[data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
span[data-tip],div[data-tip],b[data-tip]{cursor:help}
.ib.lab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1;padding:3px 6px;min-width:44px}.ib.lab span{font-size:10px;font-weight:600;margin-top:2px}
.energy{flex:none}.energy .et{font-size:10px;line-height:1.05;text-align:center;margin-right:2px}.energy .et b{font-size:15px;color:var(--ink)}.energy i{width:12px!important;height:12px!important}
.loot2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lootc{padding:8px 6px;gap:3px}.lootc svg{width:38px;height:38px}.lootc .nm{font-size:12.5px}.lootc .fx{font-size:11px}
.fury small{margin-right:4px}
.pools{display:flex;flex-direction:column;gap:2px}.pools .st{display:flex;align-items:center;justify-content:space-between;gap:4px}.pools small{min-width:38px}
.nrg i{border-color:#e0b43a!important;border-radius:2px!important;transform:rotate(45deg) scale(.85)}.nrg i.on{background:#e0b43a!important;box-shadow:0 0 6px #e0b43a!important}
.inspected{outline:3px solid var(--accent)!important;outline-offset:2px;border-radius:8px}
#tip.loupe{font-size:15px;padding:10px 13px;max-width:min(330px,calc(100vw - 16px));border:2px solid var(--accent)}
.hand2{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hc2{border:2px solid var(--line);border-radius:10px;background:var(--card2);display:flex;flex-direction:column;overflow:hidden;animation:pop .25s both}
.hc2.sel{border-color:var(--accent)}

  const dboss = G.isDeepBossDoor(nd), p = nd === G.T.doors ? G.BOSS.p : Math.round(G.T.monBase + G.T.monPerDoor * Math.min(nd, 9.5));
  const mon = nd === G.T.doors ? { p, boss: true } : dboss ? { p, boss: true, tier: G.deepOf(nd) / G.T.deepBossEvery } : nd > G.T.doors ? { p: 17, depth: G.deepOf(nd) } : { p };
  if (s.lease) mon.lease = s.lease;
  const st = G.monStats(mon);
  let say = s.bossDown && s.door === G.T.doors ? '<b>The Landlord is down.</b> Home, or deeper? ' : '';
  say += nd === G.T.doors ? `The Landlord: ${st.hp} health, swings for ${st.dmg}, doubled on a Wind-up.` : dboss ? `A boss: about ${st.hp} health, swings for ${st.dmg}.` : `Next monsters swing for about ${st.dmg}, doubled on a Wind-up.`;
  if (pk) say += ` 🏮 Next: <b>${pk.type === 'monster' ? esc(pk.mon.n) : pk.type}</b>.`;
  say += ` You hold <b>${s.cards.length}</b> card${s.cards.length === 1 ? '' : 's'}${s.spent.length ? `, ${s.spent.length} spent` : ''}.`;
  const camp = G.canCamp(s) ? `<button class="campb" data-act="camp" data-tip="Rest here: your ${s.spent.length} spent cards come back and you lose one card of your choice for the run.">Camp<small>+${s.spent.length} cards back, lose 1</small></button>` : '';
  return `<p class="say">${say}</p><div class="two"><button class="safe" id="bank" data-tip="End the run safely and bank your coins as gold.">Walk home<small>Bank ${bv} gold</small></button><button class="primary" id="open" data-tip="Open the next door. Monster, treasure, shrine, hearth or curse. Your Grit does not refill." >${nd > G.T.doors ? 'Go deeper' : 'One more door'}<small>Door ${nd} · ×${G.multAt(nd)}</small></button></div>${camp}`;
}
function hearthPanel(s){
  const can = s.deck.length > G.T.minDeck, lost = s.lost.length + s.burned.length, mend = Math.min(G.T.mendN, lost);
  return `<p class="say"><b>A hearth, burning low.</b> Pick one.</p><div class="two"><button class="safe" data-rest="rest" data-tip="Heal Grit.">Rest<small>+${Math.min(G.T.restHeal, s.maxGrit - s.grit)} Grit</small></button><button class="primary" data-rest="mend" ${mend ? '' : 'disabled'} data-tip="Bring back up to ${G.T.mendN} lost cards.">Mend<small>${mend ? '+' + mend + ' lost card' + (mend > 1 ? 's' : '') : 'nothing lost'}</small></button><button data-rest="temper" data-tip="+1 Might for the rest of this run.">Sharpen<small>+1 Might</small></button><button data-sheet="cull" data-tip="Remove one card from your deck for this run." ${can ? '' : 'disabled'}>Burn a card<small>${can ? 'thin your deck' : 'deck too small'}</small></button></div>`;
}
function waitPanel(s){
  const t = { treasure: 'Sort what you found.', favor: 'Choose a favor.', spoils: 'Choose your spoils.' }[s.phase] || '';
  return `<p class="say muted">${t}</p>`;
}
function overScene(s){
  const e = s.ended, dead = e.how === 'dead';
  return `<div class="scene">${corridorSVG({ num: e.door, boss: e.door === G.T.doors || G.isDeepBossDoor(e.door), open: true })}<div class="actors">${dead ? '<div></div>' : heroSVG(s)}${s.ev && s.ev.mon && (dead || e.how === 'victory') ? monsterSVG(s.ev.mon, e.how === 'victory' ? 'fallen' : '') : '<div></div>'}</div>${dead ? '<div class="redflash" style="animation:none;opacity:.35"></div>' : ''}${narrBox()}</div>`;
}
function overPanel(s){
  const e = s.ended;
  const title = e.how === 'victory' && e.deep ? 'Home from the Deep' : { dead: 'You died', banked: 'You made it home', victory: 'The Landlord falls', 'fled-boss': 'You fled the Landlord', exhausted: 'Out of cards' }[e.how];
  const nl = e.newLease ? ` <b>New Lease opened:</b> ${esc(G.leaseName(e.lease + 1))}, and Forge limits rose.` : '';
  return `<p class="say"><b>${title}.</b> ${e.how === 'dead' ? `Door ${e.door} was one too many.` : `Home from door ${e.door}.`} <b class="gold">${e.gold} gold</b>, <b class="ember">+${s._emb != null ? s._emb : e.embers} embers</b>.${nl}</p><button class="primary go" id="town">Back to town</button>`;
}

// ---------- sheets ----------
function renderSheet(){
  if (!sheet) return '';
  const s = run;
  let title = '', body = '';
  if (sheet === 'help'){ title = 'How to play'; body = helpBody(); }
  else if (!s){ sheet = null; return ''; }
  else if (sheet === 'gear'){ title = 'Gear'; body = gearBody(s); }
  else if (sheet === 'log'){ title = 'Run log'; body = `<div class="log">${s.log.slice(-30).reverse().map(l => `<p>${esc(l)}</p>`).join('')}</div>`; }
  else if (sheet === 'losefight' || sheet === 'losecamp'){ title = sheet === 'losecamp' ? 'Camp: lose one card' : 'Rest: lose one card'; body = loseBody(s); }
  else if (sheet === 'deck' || sheet === 'cull'){
    const cull = sheet === 'cull' && s.phase === 'hearth';
    title = cull ? 'Burn a card' : `Your deck · ${s.deck.length} cards`;
    const ids = s.deck.map((id, i) => [id, i]).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
    body = `<p class="small muted" style="margin:0 0 8px">${cull ? 'Tap a card to burn it for the rest of this run. A smaller deck draws your best cards more often.' : `Hand ${s.cards.length} · spent ${s.spent.length} · lost ${s.lost.length + s.burned.length}. You carry up to ${G.T.handCap} cards. Each card has a top half and a bottom half; play one of each per turn.`}</p><div class="cgrid">${ids.map(([id, i]) => tileCard(id, '', cull ? `data-cull="${i}"` : 'tabindex="-1"')).join('')}</div>`;
    if (s.favors.length) body += `<div class="sec"><h3>Favors</h3></div><div class="favs">${s.favors.map(id => { const f = G.FAVORS.find(x => x.id === id); return `<span class="fav" data-tip="${esc(f.d)}">${patronIcon(f.p, 16)} ${esc(f.n)}</span>`; }).join('')}</div><p class="tiny muted">${s.favors.map(id => { const f = G.FAVORS.find(x => x.id === id); return `<b>${esc(f.n)}:</b> ${esc(f.d)}`; }).join(' ')}</p>`;
  }
  return `<div class="sheetbg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><h2 style="font-size:18px">${esc(title)}</h2><button class="ib" id="sclose" aria-label="Close">✕</button></div>${body}</div></div>`;
}
function gearBody(s){
  const can = s.phase === 'door';
  const card = (t, where, i, lab) => t ? `<button class="icard" ${can ? `data-item="${where}:${i}"` : 'disabled'}>${lab ? `<span class="slotlab">${lab}</span>` : ''}${icon(t)}<span class="nm">${esc(t.n)}</span><span class="fx">${esc(shortFx(t))}</span></button>` : `<div class="icard empty">${lab ? `<span class="slotlab">${lab}</span>` : ''}<span class="nm">empty</span></div>`;
  const g = s.gear, two = g.hand1 && g.hand1.two;
  let h = `<p class="small muted" style="margin:0 0 8px">Might ${G.might(s)} · Armor ${G.armor(s)} · escape ${pct(G.escapeChance(Object.assign({}, s, { fight: { mon: {}, twistEsc: 0, escBonus: 0 } })))}. ${can ? 'Tap an item to manage it.' : 'You can only rearrange between doors.'}</p><div class="doll">`;
  h += card(g.head, 'gear', 'head', 'Head') + card(g.body, 'gear', 'body', 'Body') + card(g.feet, 'gear', 'feet', 'Feet') + card(g.hand1, 'gear', 'hand1', 'Hand') + (two ? `<div class="icard empty"><span class="slotlab">Hand</span><span class="nm">both hands</span></div>` : card(g.hand2, 'gear', 'hand2', 'Hand'));
  h += `</div><div class="sec"><h3>Belt</h3><span class="tiny muted">${s.hand.length}/${G.T.handMax} · usable in fights</span></div><div class="tray">`;
  h += s.hand.length ? s.hand.map((c, i) => card(c, 'hand', i)).join('') : `<div class="icard empty"><span class="nm">no one-shots</span></div>`;
  h += `</div><div class="sec"><h3>Pack</h3><span class="tiny muted">${s.bag.length}/${G.T.bagMax} · storage only</span></div><div class="tray">`;
  for (let i = 0; i < G.T.bagMax; i++) h += s.bag[i] ? card(s.bag[i], 'bag', i) : `<div class="icard empty"><span class="nm">empty</span></div>`;
  return h + `</div>`;
}
function helpBody(){
  return `<div class="small"><p><b>Doors.</b> Open them one at a time. After any door you can walk home and bank your coins, multiplied by how deep you got. Die and you lose what you carry. Door 10 is the Landlord.</p>
<p><b>Your hand is your stamina.</b> You start with 8 cards and no deck to draw from. Each turn you play two: the <b>top half</b> of one and the <b>bottom half</b> of the other. Played cards are <b>spent</b>.</p>
<p><b>Speed.</b> The card you pick first leads. If its ⚡ beats the monster's ⚡, you act before its move, so a killing blow means it never swings. Block always lands.</p>
<p><b>Getting cards back.</b> Rest (mid-fight or at a camp between doors) returns all spent cards but loses one for good. Loot picks return 4 spent cards. Smelling Salts return 3. Hearths and Mending Thread bring back lost cards. <b>Beating a boss is a checkpoint:</b> every card comes back and you heal fully.</p>
<p><b>Moves to watch:</b> a <b>Swipe</b> hits for the number shown; a <b>Wind-up</b> hits double but is slow; <b>Guard</b> halves your attacks; a <b>Hex</b> curses you; a <b>Rend</b> tears a card from your hand if it hits. Run out of cards and you stagger home with half your coins.</p>
<p><b>Distance.</b> You and the monster are Close, Near, Far or Distant. Near is normal. Each step closer adds a third to Might, and each step further takes a third off (rounded down), for you and the monster alike. Any half can be played as a move of 1 instead (◀ ▶), and movement cards move 2 or 3 and are quick. Ranged attacks ignore distance. Brutes charge in, Skirmishers back off and shoot, Lurkers pounce from afar, and Wardens never move.</p>
<p><b>Numbers.</b> Attacks use your <b>Might</b> (level + weapons). Blocks use your <b>Armor</b>. You carry up to ${G.T.handCap} cards.</p></div>`;
}

// ---------- modals ----------
function srcLine(t){
  if (t.src === 'start') return 'Your starting kit';
  if (t.src === 'keepsake') return 'Your keepsake from last run';
  if (t.src === 'stash') return 'Found in a forgotten stash';
  if (t.src === 'fight') return 'Loot from ' + (/^The /.test(t.from) ? t.from : 'the ' + t.from);
  return '';
}
function itemCardBody(t){ return `<div class="art">${icon(t)}</div><h2>${esc(t.n)}</h2><div class="kind">${esc(kindLine(t))}</div>${FLAVOR[t.id] ? `<p class="flav">${esc(FLAVOR[t.id])}</p>` : ''}`; }
function equipCompare(s, t){
  const rep = G.replacedBy(s, t), d = G.equipDelta(s, t), m = G.might(s), a = G.armor(s);
  const sg = x => `<span class="${x > 0 ? 'okc' : x < 0 ? 'badc' : 'muted'}">(${x >= 0 ? '+' : ''}${x})</span>`;
  let h = `<div class="cmp">Might ${m} → <b>${m + d.might}</b> ${sg(d.might)} · Armor ${a} → <b>${a + d.armor}</b> ${sg(d.armor)}${d.esc ? ` · Escape ${sg(d.esc)}` : ''}`;
  if (rep.length){ let room = G.T.bagMax - s.bag.length; h += `<br><span class="muted">Replaces ${rep.map(r => esc(r.n) + ' (' + (room-- > 0 ? 'to your pack' : 'sold for ' + G.treasureValue(r)) + ')').join(' and ')}.</span>`; }
  return h + `</div>`;
}
function gainTxt(s, t){ const d = G.equipDelta(s, t), p = []; if (d.might) p.push((d.might > 0 ? '+' : '') + d.might + ' Might'); if (d.armor) p.push((d.armor > 0 ? '+' : '') + d.armor + ' Armor'); if (d.esc) p.push('escape ' + (d.esc > 0 ? '+' : '') + d.esc); return p.join(', ') || 'no change'; }
const modal = (label, inner) => `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="mcard">${inner}</div></div>`;
function renderModal(){
  if (!run) return '';
  const s = run;
  if (capNew){ if (s.deck.length <= G.T.handCap){ capNew = null; } else return modal('Too many cards', `<div class="kicker">Your hand is full</div><h2>Leave one behind</h2>` + capBody(s)); }
  if (s.phase === 'spoils' && s.spoils){
    const sp = s.spoils, e = s.ev && s.ev.t === 'win' ? s.ev : null;
    let h = `<div class="kicker">Spoils</div><h2>${e ? 'You beat ' + esc(/^The /.test(e.mon.n) ? e.mon.n : 'the ' + e.mon.n) : 'Victory'}</h2>`;
    if (e) h += `<p class="kind">+${e.lv} level${e.lv > 1 ? 's' : ''} · <span class="gold">+${e.coins} coins</span>${e.heal ? ` · <span class="okc">+${e.heal} Grit</span>` : ''}</p>`;
    h += `<p class="small" style="text-align:center;margin:8px 0">${sp.loot ? `Take one thing. Loot is gear or a one-shot, and it also gives you back ${G.T.lootRecover} spent cards. A card is a new move for your hand.` : 'Choose a card for your deck.'}</p>`;
    if (sp.loot && sp.lootOpts){
      h += `<div class="sec"><h3>Loot</h3><span class="tiny muted">pick one find</span></div><div class="loot2">`;
      h += sp.lootOpts.map((t, i) => `<button class="icard lootc" data-spoil="loot" data-i="${i}" data-tip="${esc(t.n)}: ${esc(kindLine(t))}">${icon(t)}<span class="nm">${esc(t.n)}</span><span class="fx">${esc(shortFx(t))}</span><span class="tiny ${t.k === 'gear' && G.equipGain(s, t) > 0 ? 'okc' : 'muted'}">${t.k === 'gear' ? (t.only && t.only !== s.calling ? G.CALLINGS[t.only].n + 's only' : gainTxt(s, t)) : 'one-shot for your belt'}</span></button>`).join('') + '</div>';
      h += `<div class="sec"><h3>Or a card</h3><span class="tiny muted">a new move${G.T.cardLevel ? ', +' + G.T.cardLevel + ' level' : ''}</span></div>`;
    }
    h += `<div class="cgrid" style="margin-top:4px">${sp.cards.map((id, i) => tileCard(id, '', `data-spoil="card" data-i="${i}"`)).join('')}</div>`;
    h += `<div class="acts"><button class="ghost" data-spoil="skip">Skip<small>keep your deck lean</small></button></div>`;
    return modal('Spoils', h);
  }
  if (s.phase === 'treasure' && s.queue.length){
    const t = s.queue[0], tot = s.queue.length;
    let h = `<div class="kicker">${esc(srcLine(t))}${tot > 1 ? ` · ${tot} to sort` : ''}</div>` + itemCardBody(t);
    const acts = [];
    if (t.k === 'gear'){
      const bad = t.only && t.only !== s.calling, gain = G.equipGain(s, t);
      if (!bad) h += equipCompare(s, t);
      acts.push(`<button class="${!bad && gain > 0 ? 'primary' : ''}" data-take="equip" ${bad ? 'disabled' : ''}>Equip<small>${bad ? G.CALLINGS[t.only].n + 's only' : gainTxt(s, t)}</small></button>`);
    } else {
      const full = s.hand.length >= G.T.handMax;
      acts.push(`<button class="${full ? '' : 'primary'}" data-take="keep" ${full ? 'disabled' : ''}>Put on belt<small>${full ? 'belt full' : esc(shotShort(t)) + ' · ' + s.hand.length + '/' + G.T.handMax}</small></button>`);
    }
    acts.push(`<button data-take="bag" ${G.bagRoom(s) ? '' : 'disabled'}>Store in pack<small>${G.bagRoom(s) ? s.bag.length + '/' + G.T.bagMax : 'pack full'}</small></button>`);
    acts.push(`<button data-take="sell">Sell<small class="gold">+${G.treasureValue(t)} coins</small></button>`);
    return modal('New item', h + `<div class="acts">${acts.join('')}</div>`);
  }
  if (s.phase === 'favor' && s.offer){
    const from = s.ev && s.ev.t === 'shrine' ? `Door ${s.door} · a shrine` : 'Before you go down';
    let h = `<div class="kicker">${from}</div><h2>Choose one favor</h2><p class="kind" style="margin-bottom:8px">It lasts for this run.</p><div class="favpick">`;
    h += s.offer.map((id, i) => { const f = G.FAVORS.find(x => x.id === id), pt = G.PATRONS[f.p]; return `<button class="favc p-${f.p}" data-favor="${i}">${patronIcon(f.p, 36)}<span class="pn">${esc(pt.n)}</span><b>${esc(f.n)}</b><span class="fd">${esc(f.d)}</span></button>`; }).join('') + '</div>';
    if (s.rerolls > 0) h += `<div class="acts"><button class="ghost" id="reroll">Reroll the offer<small>${s.rerolls} left</small></button></div>`;
    return modal('Choose a favor', h);
  }
  if (s.phase === 'door' && s.ev && s.ev.t === 'curse' && s._ack !== s.ev.n){
    const c = s.ev.curse;
    return modal('Curse', `<div class="kicker">Door ${s.door} · a curse</div><div class="art"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="#3b2550"/><path d="M16 20l4 4m0-4l-4 4M28 20l4 4m0-4l-4 4M16 33q8-6 16 0" stroke="#ffd23f" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div><h2>${esc(c.n)}</h2><p class="flav">${esc(c.f)}</p><div class="acts"><button class="primary" id="ack">Shake it off<small>continue</small></button></div>`);
  }
  if (manageSel && s.phase === 'door'){
    const [w, key] = manageSel; const i = w === 'gear' ? key : +key;
    const t = w === 'bag' ? s.bag[i] : w === 'hand' ? s.hand[i] : s.gear[i];
    if (!t){ manageSel = null; return ''; }
    let h = `<div class="kicker">${w === 'gear' ? 'Equipped' : w === 'hand' ? 'On your belt' : 'In your pack'}</div>` + itemCardBody(t);
    const acts = [];
    if (t.k === 'gear' && w !== 'gear'){ const bad = t.only && t.only !== s.calling, gain = G.equipGain(s, t); if (!bad) h += equipCompare(s, t); acts.push(`<button class="${!bad && gain > 0 ? 'primary' : ''}" data-m="equip" ${bad ? 'disabled' : ''}>Equip<small>${bad ? G.CALLINGS[t.only].n + 's only' : gainTxt(s, t)}</small></button>`); }
    if (t.k === 'shot' && w === 'bag'){ const full = s.hand.length >= G.T.handMax; acts.push(`<button class="primary" data-m="ready" ${full ? 'disabled' : ''}>Put on belt<small>${full ? 'belt full' : s.hand.length + '/' + G.T.handMax}</small></button>`); }
    if (w === 'gear') h += `<div class="cmp">Taking it off costs ${esc(shortFx(t))}.</div>`;
    if (t.k === 'shot' && w === 'hand' && ((t.fx === 'recover' && s.spent.length) || (t.fx === 'mend' && s.lost.length + s.burned.length))) acts.unshift(`<button class="primary" data-m="use">Use now<small>${esc(shotShort(t))}</small></button>`);
    if (t.k === 'shot' && t.fx === 'heal'){ const room = s.maxGrit - s.grit; acts.unshift(`<button class="primary" data-m="drink" ${room ? '' : 'disabled'}>Drink now<small>${room ? '+' + Math.min(t.v, room) + ' Grit' : 'Grit is full'}</small></button>`); }
    if (w !== 'bag') acts.push(`<button data-m="bag" ${G.bagRoom(s) ? '' : 'disabled'}>Store in pack<small>${G.bagRoom(s) ? s.bag.length + '/' + G.T.bagMax : 'pack full'}</small></button>`);
    acts.push(`<button data-m="sell">Sell<small class="gold">+${G.treasureValue(t)} coins</small></button>`);
    acts.push(`<button class="ghost" id="mclose">Close<small></small></button>`);
    return modal(t.n, h + `<div class="acts">${acts.join('')}</div>`);
  }
  return '';
}

// ---------- town ----------
function renderTown(){
  let h = `<div class="thead"><h1>One More Door</h1><span class="money"><span data-tip="Gold: bank it by walking home from a run. Spend it in the Forge, Library and on provisions."><b class="gold">${meta.gold}</b> <span class="small muted">gold</span></span> · <span data-tip="Embers: earned for every door you clear, even if you die. Spend them in the Embers tab."><b class="ember">${meta.embers}</b> <span class="small muted">embers</span></span></span></div>`;
  h += `<div class="tscene">${townSVG()}<div class="keeper"><b>${G.KEEPER}:</b> “${esc(G.tavernLine(meta, lastEnd))}”</div></div>`;
  const dot = has => has ? '<span class="dot"></span>' : '';
  const canForge = G.FORGE.some(f => meta.forge[f.id] < G.forgeMax(meta, f) && meta.gold >= G.forgeCost(f, meta.forge[f.id]));
  const canEmb = G.EMBERS.some(e => { const r = G.emberRank(meta, e); return r < e.cost.length && meta.embers >= G.emberCost(e, r); });
  const canLib = G.LIBRARY.some(id => !meta.cards.includes(id) && meta.gold >= G.CARDS[id].price) || (G.canRetire(meta) && meta.gold >= G.retireCost(meta));
  h += `<div class="tabs" role="tablist">${[['go', 'Go'], ['forge', 'Forge' + dot(canForge)], ['library', 'Library' + dot(canLib)], ['embers', 'Embers' + dot(canEmb)]].map(([k, n]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-tab="${k}" data-tip="${{ go: 'Set up and start a run.', forge: 'Permanent upgrades bought with gold.', library: 'Retire weak starting cards, and buy new cards that can show up as rewards.', embers: 'Lasting gifts bought with Embers, which you earn even when you die.' }[k]}">${n}</button>`).join('')}</div>`;
  h += `<div class="tbody">${tab === 'forge' ? forgeTab() : tab === 'library' ? libraryTab() : tab === 'embers' ? embersTab() : goTab()}</div>`;
  if (tab === 'go') h += `<button class="primary go" id="go">Go down the cellar</button>`;
  return h;
}
function goTab(){
  let h = `<div class="box"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="small" data-tip="Your class for this run. Unlock more in the Embers tab.">Calling</b>${!meta.runs ? '<button class="ib" data-sheet="help" style="font-size:12px">How to play</button>' : `<span class="tiny muted">Runs ${meta.runs} · best door ${meta.bestDoor} · Landlord ×${meta.bossKills}</span>`}</div><div class="calls">`;
  for (const id in G.CALLINGS){ const c = G.CALLINGS[id], un = meta.unlocked[id];
    h += `<button class="call ${calling === id ? 'sel' : ''}" data-call="${id}" ${un ? '' : 'disabled'} data-tip="${esc(c.d)}">${c.n}<small>${un ? ({ brawler: '+2 Might vs big', sneak: 'Easy escapes', warden: '+2 Armor' }[id] || '') : c.unlock + ' embers'}</small></button>`; }
  h += `</div></div>`;
  const L = meta.lease, top = meta.leaseBest + 1, lp = 1 + G.T.leaseGold * L;
  h += `<div class="box"><div class="lease"><button data-lease="${L - 1}" data-tip="Easier Lease." ${L <= 0 ? 'disabled' : ''} aria-label="Easier lease">◀</button><div><b>${esc(G.leaseName(L))}</b><div class="tiny muted">${L ? `Monsters +${Math.round(G.T.leaseHp * L * 100)}% health, +${Math.floor(G.T.leaseDmg * L)} damage · gold ×${lp}` : 'The doors as they are'}${L >= top && meta.leaseBest >= 0 ? '' : ''}</div></div><button data-lease="${L + 1}" data-tip="Harder Lease: tougher monsters, more gold and Embers." ${L >= top ? 'disabled' : ''} aria-label="Harder lease">▶</button></div>${L >= top ? `<p class="tiny muted" style="margin:4px 0 0;text-align:center">${meta.leaseBest < 0 ? 'Beat the Landlord to open harder Leases.' : 'Beat the Landlord here to open the next Lease and raise Forge limits.'}</p>` : ''}</div>`;
  h += `<div class="box"><b class="small" data-tip="Bought with gold before a run. Used up when the run starts.">Provisions</b> <span class="tiny muted">one run only</span><div class="prov" style="margin-top:6px">${G.PROVISIONS.map(p => { const on = meta.provisions[p.id], c = G.provisionCost(meta, p); return `<button class="${on ? 'on' : ''}" data-prov="${p.id}" ${on || meta.gold < c ? 'disabled' : ''} data-tip="${esc(p.d)}">${esc(p.n)}<small class="pe">${esc({ whet: '+1 Might', tonic: '+1 healing tonic', trick: '+1 random card' }[p.id] || p.d)}</small><small>${on ? 'packed' : c + ' gold'}</small></button>`; }).join('')}</div></div>`;
  if (meta.oathUnlocked) h += `<label class="row small box"><input type="checkbox" id="oath" ${oath ? 'checked' : ''}> <span><b>Oath of the Deep:</b> one more Twist per monster, gold ×1.5.</span></label>`;
  h += `<p class="tiny muted" style="text-align:center;margin:0">Progress saves in this browser. <button id="reset" class="ghost" style="min-height:0;padding:2px 6px;font-size:11px">Reset save</button></p>`;
  return h;
}
function forgeTab(){
  let h = `<p class="tiny muted" style="margin:0">Permanent, paid in gold. Beating the Landlord on a new Lease raises the limits.</p><div class="box">`;
  for (const f of G.FORGE){ const r = meta.forge[f.id], mx = G.forgeMax(meta, f), maxed = r >= mx, cost = maxed ? 0 : G.forgeCost(f, r);
    h += `<div class="fitem"><div><b class="small">${f.n}</b> <span class="pips">${'●'.repeat(r)}${'○'.repeat(Math.max(0, mx - r))}</span><div class="d">${f.d}</div></div><button data-buy="${f.id}" ${maxed || meta.gold < cost ? 'disabled' : ''}>${maxed ? (f.grow ? 'Next Lease' : 'Maxed') : cost + ' gold'}</button></div>`; }
  return h + `</div>`;
}
function libraryTab(){
  const deck = G.startDeck(meta), cost = G.retireCost(meta), can = G.canRetire(meta);
  let h = `<div class="sec" style="margin:0"><h3 data-tip="The ${deck.length} cards every run starts with. Retiring weak ones means you draw your best cards more often.">Starting deck</h3><span class="tiny muted">${can ? `retire one for <b class="gold">${cost}</b> gold` : `smallest it can go (${G.T.minDeck})`}</span></div><div class="cgrid four">`;
  h += deck.map((id, i) => tileCard(id, retireSel === i ? '<span class="tiny badc">tap to confirm</span>' : '', `data-retire="${i}" ${can && meta.gold >= cost ? '' : 'disabled'} ${retireSel === i ? 'style="box-shadow:0 0 0 3px var(--bad)"' : ''}`, true)).join('') + '</div>';
  if (meta.retired.length) h += `<p class="tiny muted" style="margin:0">Retired: ${meta.retired.map((id, i) => `<button class="ghost" data-restore="${i}" data-tip="Put it back in your starting deck. The gold is not refunded." style="min-height:0;padding:1px 6px;font-size:11px">${esc(G.CARDS[id].n)} ↺</button>`).join(' ')}</p>`;
  h += `<div class="sec" style="margin:4px 0 0"><h3>New cards</h3><span class="tiny muted">once bought, they can turn up as rewards</span></div><div class="cgrid">`;
  for (const id of G.LIBRARY){ const c = G.CARDS[id], own = meta.cards.includes(id);
    h += tileCard(id, `<span class="tiny ${own ? 'okc' : 'gold'}">${own ? 'Owned' : c.price + ' gold'}</span>`, `data-lib="${id}" ${own || meta.gold < c.price ? 'disabled' : ''}`); }
  return h + `</div>`;
}
function embersTab(){
  let h = `<p class="tiny muted" style="margin:0">Embers come home from every door you clear, even when you die.</p><div class="box">`;
  for (const e of G.EMBERS){ const r = G.emberRank(meta, e), max = e.cost.length, maxed = r >= max, cost = maxed ? 0 : G.emberCost(e, r), d = e.calling ? G.CALLINGS[e.calling].d : e.d;
    h += `<div class="fitem"><div><b class="small">${esc(e.n)}</b> <span class="pips ember">${'●'.repeat(r)}${'○'.repeat(max - r)}</span><div class="d">${esc(d)}</div></div><button data-ember="${e.id}" ${maxed || meta.embers < cost ? 'disabled' : ''}>${maxed ? (e.calling ? 'Unlocked' : 'Maxed') : cost + ' embers'}</button></div>`; }
  return h + `</div>`;
}

// ---------- input ----------
function act(fn){
  const n0 = run.log.length, e0 = run.ev ? run.ev.n : 0;
  fn();
  const e = run.ev || {};
  narr = run.log.length > n0 ? run.log.slice(n0) : [];
  if (e.n !== e0) fx = { monster: 'open', stash: 'open', shrine: 'open', hearth: 'open', curse: 'curse', win: 'win', escape: 'escape', exchange: 'exchange', dead: 'caught', shot: 'shot', heal: 'heal', rested: 'heal', fizzle: 'fizzle', card: 'card', pair: 'card', camp: 'heal' }[e.t] || null;
  if (run.phase === 'over' && !run.settled){ const r = G.settle(meta, run); run._emb = r ? r.embers : 0; }
  if (sheet && sheet !== 'help' && run.phase !== 'door' && run.phase !== 'fight') sheet = null;
  if (sheet === 'losefight' && run.phase !== 'fight') sheet = null;
  if (run.phase !== 'fight') pick = [];
  save(); render();
}
function bind(){
  const all = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
  all('#go', () => { run = G.startRun(meta, { calling, oath: meta.oathUnlocked && oath }); narr = []; manageSel = null; sheet = null; save(); render(); });
  all('#open', () => act(() => G.openDoor(run)));
  all('#bank', () => act(() => G.bank(run)));
  bindHalves();
  all('[data-fc]', b => setFocus(+b.dataset.fc));
  all('[data-act]', b => { const a = b.dataset.act;
    if (a === 'run') { pick = []; act(() => G.runAway(run)); }
    else if (a === 'rest') { sheet = 'losefight'; render(); }
    else if (a === 'camp') { sheet = 'losecamp'; render(); }
    else if (a === 'play') { const pv = pairPreview(run); if (!pv) return; pairFx = { dmg: pv.dmg, blk: pv.blk }; pick = []; act(() => G.playPair(run, pv.t.i, pv.b.i, pv.lead, pv.t.mode, pv.b.mode)); } });
  all('[data-lose]', b => { const i = +b.dataset.lose, w = sheet; sheet = null; pick = []; act(() => w === 'losecamp' ? G.restCamp(run, i) : G.restFight(run, i)); });
  all('[data-drop]', b => { const nw = capNew; capNew = null; G.swapOut(run, nw, b.dataset.drop); narr = [`You leave ${G.CARDS[b.dataset.drop].n} behind.`]; save(); render(); });
  all('[data-favor]', b => act(() => G.takeFavor(run, +b.dataset.favor)));
  all('[data-rest]', b => act(() => G.rest(run, b.dataset.rest)));
  all('[data-cull]', b => { sheet = null; act(() => G.rest(run, 'cull', +b.dataset.cull)); });
  all('[data-spoil]', b => act(() => { const sp = b.dataset.spoil, id = sp === 'card' && run.spoils ? run.spoils.cards[+(b.dataset.i || 0)] : null; G.chooseSpoils(run, sp, +(b.dataset.i || 0)); if (id && run.deck.length > G.T.handCap) capNew = id; }));
  all('#ack', () => { run._ack = run.ev.n; save(); render(); });
  all('#mclose', () => { manageSel = null; render(); });
  all('#town', () => { lastEnd = Object.assign({}, run.ended, { embersGained: run._emb }); run = null; narr = []; sheet = null; tab = 'go'; save(); render(); });
  all('[data-shot]', b => act(() => G.playShot(run, +b.dataset.shot)));
  all('[data-take]', b => act(() => G.takeTreasure(run, b.dataset.take)));
  all('[data-item]', b => { const [w, k] = b.dataset.item.split(':'); manageSel = [w, k]; sheet = null; render(); });
  all('[data-m]', b => { const [w, k] = manageSel; const i = w === 'gear' ? k : +k; const e0 = run.ev ? run.ev.n : 0; if (b.dataset.m === 'use') G.playShot(run, i); else G.manage(run, w, i, b.dataset.m); manageSel = null; narr = run.log.slice(-1); if (run.ev && run.ev.n !== e0 && run.ev.t === 'heal') fx = 'heal'; save(); render(); });
  all('#reroll', () => act(() => G.rerollFavor(run)));
  all('[data-sheet]', b => { sheet = b.dataset.sheet; render(); });
  all('#sclose', () => { sheet = null; render(); });
  const bg = document.querySelector('.sheetbg'); if (bg) bg.onclick = ev => { if (ev.target === bg){ sheet = null; render(); } };
  all('[data-tab]', b => { tab = b.dataset.tab; retireSel = null; render(); });
  all('[data-call]', b => { calling = b.dataset.call; render(); });
  all('[data-lease]', b => { G.setLease(meta, +b.dataset.lease); save(); render(); });
  all('[data-prov]', b => { G.buyProvision(meta, b.dataset.prov); save(); render(); });
  all('[data-buy]', b => { G.buyForge(meta, b.dataset.buy); save(); render(); });
  all('[data-retire]', b => { const i = +b.dataset.retire; if (retireSel === i){ G.retireCard(meta, G.startDeck(meta)[i]); retireSel = null; save(); } else retireSel = i; render(); });
  all('[data-restore]', b => { G.restoreCard(meta, +b.dataset.restore); save(); render(); });
  all('[data-lib]', b => { G.buyCard(meta, b.dataset.lib); save(); render(); });
  all('[data-ember]', b => { if (G.buyEmber(meta, b.dataset.ember)){ const e = G.EMBERS.find(x => x.id === b.dataset.ember); if (e.calling) calling = e.calling; } save(); render(); });
  const ob = $('#oath'); if (ob) ob.onchange = () => { oath = ob.checked; };
  const rb = $('#reset'); if (rb) rb.onclick = () => { if (rb.dataset.arm){ meta = G.newMeta(); run = null; lastEnd = null; calling = 'brawler'; save(); render(); } else { rb.dataset.arm = '1'; rb.textContent = 'Tap again to erase everything'; } };
  const m = document.querySelector('.modal button:not([disabled]), .sheet button:not([disabled])'); if (m && document.activeElement === document.body) m.focus({ preventScroll: true });
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && (manageSel || sheet)){ manageSel = null; sheet = null; render(); return; }
  if (!run || run.phase !== 'fight' || sheet || manageSel || ev.target.closest && ev.target.closest('input')) return;
  if (ev.key === 'Enter'){ const pv = pairPreview(run); if (pv){ pairFx = { dmg: pv.dmg, blk: pv.blk }; pick = []; act(() => G.playPair(run, pv.t.i, pv.b.i, pv.lead, pv.t.mode, pv.b.mode)); } }
});
function bindHalves(){ document.querySelectorAll('[data-half]').forEach(b => b.onclick = () => { const [i, half, mode] = b.dataset.half.split(':'); const k = pick.findIndex(p => p.i === +i && p.half === half); if (k >= 0 && pick[k].mode === mode) pick.splice(k, 1); else if (k >= 0) pick[k].mode = mode; else { pick = pick.filter(p => p.half !== half && p.i !== +i); pick.push({ i: +i, half, mode: mode || 'fx' }); } render(); }); }
// ---------- inspect: hold a finger down, then slide it across anything to read about it ----------
let holdT = null, holdAt = null, inspecting = false, insEl = null, swallowUntil = 0, hoverT = null;
function tipText(el){ return el ? el.getAttribute('data-tip') : ''; }
function placeTip(x, y, above){
  const b = $('#tip'), w = b.offsetWidth, h = b.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = Math.min(Math.max(8, x - w / 2), vw - w - 8), top = above ? y - h - 56 : y + 14;
  if (top < 8) top = Math.min(vh - h - 8, y + 56);
  b.style.left = left + 'px'; b.style.top = top + 'px';
}
function setInspected(el){ if (insEl === el) return; if (insEl) insEl.classList.remove('inspected'); insEl = el; if (el) el.classList.add('inspected'); }
function inspectAt(x, y){
  const hit = document.elementFromPoint(x, y), el = hit && hit.closest('[data-tip]'), b = $('#tip');
  setInspected(el);
  if (!el){ b.hidden = true; return; }
  if (b.dataset.for !== tipText(el)){ b.textContent = tipText(el); b.dataset.for = tipText(el); }
  b.hidden = false; b.classList.add('loupe'); placeTip(x, y, true);
}
function showTip(el){ const b = $('#tip'), t = tipText(el); if (!t) return; b.textContent = t; b.dataset.for = t; b.hidden = false; b.classList.remove('loupe'); const r = el.getBoundingClientRect(); placeTip(r.left + r.width / 2, r.top, true); if (parseFloat(b.style.top) > r.top) placeTip(r.left + r.width / 2, r.bottom, false); setInspected(el); }
function hideTip(){ const b = $('#tip'); if (b){ b.hidden = true; b.dataset.for = ''; } setInspected(null); }
const pt = e => e.touches && e.touches[0] ? e.touches[0] : e.changedTouches[0];
document.addEventListener('touchstart', e => {
  clearTimeout(holdT);
  if (e.target.closest && e.target.closest('.fan') && e.touches.length === 1){ fanScan = true; hideTip(); const p = pt(e); fanAt(p.clientX, p.clientY); return; } if (e.touches.length > 1){ inspecting = false; return; }
  if (!inspecting) hideTip();
  const p = pt(e); holdAt = [p.clientX, p.clientY];
  holdT = setTimeout(() => { inspecting = true; inspectAt(holdAt[0], holdAt[1]); try { navigator.vibrate && navigator.vibrate(8); } catch (x) {} }, 320);
}, { passive: true });
document.addEventListener('touchmove', e => {
  const p = pt(e);
  if (fanScan){ e.preventDefault(); fanAt(p.clientX, p.clientY); return; }
  if (inspecting){ e.preventDefault(); inspectAt(p.clientX, p.clientY); return; }
  if (holdAt && Math.hypot(p.clientX - holdAt[0], p.clientY - holdAt[1]) > 10) clearTimeout(holdT);
}, { passive: false });
function endHold(e){
  clearTimeout(holdT); holdAt = null;
  if (fanScan){ fanScan = false; if (e.cancelable) e.preventDefault(); return; }
  if (inspecting){ inspecting = false; if (e.cancelable) e.preventDefault(); swallowUntil = Date.now() + 500; hideTip(); }
}
document.addEventListener('touchend', endHold, { passive: false });
document.addEventListener('touchcancel', endHold, { passive: false });
document.addEventListener('click', e => {
  if (Date.now() < swallowUntil){ e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && !el.closest('button')) showTip(el); else hideTip(); // a quick tap on a plain label explains it
}, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-tip], button')) e.preventDefault(); });
document.addEventListener('mouseover', e => { // desktop: hover
  if (inspecting || e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  const el = e.target.closest && e.target.closest('[data-tip]'); clearTimeout(hoverT);
  if (!el){ hideTip(); return; } if (el === insEl) return;
  hoverT = setTimeout(() => showTip(el), 300);
});
let mouseFan = false;
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.fan')){ mouseFan = true; fanAt(e.clientX, e.clientY); } });
document.addEventListener('mousemove', e => { if (mouseFan && e.buttons & 1) fanAt(e.clientX, e.clientY); else mouseFan = false; });
document.addEventListener('mouseup', () => { mouseFan = false; });
document.addEventListener('scroll', () => { if (!inspecting) hideTip(); }, true);
load(); render();

})();
</script>
